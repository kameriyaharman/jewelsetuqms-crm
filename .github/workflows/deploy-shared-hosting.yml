# Auto-deploy to Linux shared hosting (BigRock cPanel) over FTP on every push to main.
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#   FTP_SERVER    ftp.jewelsetuqms.in
#   FTP_USERNAME  the cPanel FTP account (its directory = the website folder, where index.php is)
#   FTP_PASSWORD  that account's password
# optional:
#   FTP_DIR       folder to upload into, relative to the FTP account, ending with /   (default ./)
#   FTP_PROTOCOL  ftps (default) or ftp if the host has no TLS on FTP
# www/ is uploaded as-is (frontend is already built and committed). config.local.php,
# uploads and storage on the server are never touched.
name: Deploy to shared hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-shared-hosting
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip (FTP secrets not set yet)
        if: env.FTP_SERVER == ''
        run: echo "FTP_SERVER secret is not set — nothing to deploy."
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
      - name: Upload www/ over FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          local-dir: ./www/
          server-dir: ${{ secrets.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            server/config.local.php
            server/uploads/**
            server/storage/**
