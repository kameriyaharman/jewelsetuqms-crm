# Builds the Q-TRACK Android app (android/) and publishes it at https://jewelsetuqms.in/downloads/jewelsetu-qtrack.apk
# Runs when android/ changes, or manually (Actions → Build Android app → Run workflow).
name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: deploy-shared-hosting
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Copy APK into the website
        run: |
          mkdir -p www/downloads
          cp android/app/build/outputs/apk/release/app-release.apk www/downloads/jewelsetu-qtrack.apk
          echo "{\"version\":\"1.0.${GITHUB_RUN_NUMBER}\",\"build\":${GITHUB_RUN_NUMBER},\"sha\":\"${GITHUB_SHA::7}\",\"built\":\"$(date -u +%FT%TZ)\"}" > www/downloads/jewelsetu-qtrack.json
      - uses: actions/upload-artifact@v4
        with: { name: jewelsetu-qtrack-apk, path: www/downloads/jewelsetu-qtrack.apk }
      - name: Commit APK to the repo
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/downloads/jewelsetu-qtrack.apk www/downloads/jewelsetu-qtrack.json
          git commit -m "Android app build 1.0.${GITHUB_RUN_NUMBER} [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
      - name: Upload to the website (FTP)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          local-dir: ./www/
          server-dir: ${{ secrets.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            server/config.local.php
            server/uploads/**
            server/storage/**
